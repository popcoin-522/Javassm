# 数据库自动初始化配置
# Database Auto-Initialization Configuration

# 是否启用自动初始化数据库表结构
database.auto.init.enabled=true

# 是否在每次启动时重新创建表（开发环境使用，生产环境请设为false）
database.auto.init.recreate=false

# 是否插入示例数据
database.auto.init.sample.data=true

# 初始化脚本路径
database.init.schema.script=classpath:sql/schema.sql
database.init.data.script=classpath:sql/data.sql