# Test Database Configuration (H2 In-Memory)
jdbc.driver=org.h2.Driver
jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
jdbc.username=sa
jdbc.password=

# HikariCP Configuration for Testing
hikari.maximumPoolSize=5
hikari.minimumIdle=1
hikari.connectionTimeout=30000
hikari.idleTimeout=600000
hikari.maxLifetime=1800000
hikari.leakDetectionThreshold=0