# 数据库配置 - Database Configuration
# 修改以下配置以连接到你的MySQL数据库

# 数据库连接信息 - 增强UTF-8支持
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/document_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
jdbc.username=root
jdbc.password=1234

# 连接池配置 - HikariCP Configuration
hikari.maximumPoolSize=20
hikari.minimumIdle=5
hikari.connectionTimeout=30000
hikari.idleTimeout=600000
hikari.maxLifetime=1800000
hikari.leakDetectionThreshold=60000

# 说明：
# 1. 请确保MySQL服务已启动
# 2. 修改jdbc.username和jdbc.password为你的MySQL用户名和密码
# 3. 如果数据库不存在，系统会自动创建（需要用户有创建数据库的权限）
# 4. 系统会自动创建表结构和插入示例数据